name: validate

on:
  push:
    branches: [main]
  pull_request:
  # Claude Code ships frequently and validation tightens over time. A weekly run
  # surfaces a manifest that a newer release started rejecting, rather than
  # letting customers hit it at install time.
  schedule:
    - cron: '0 14 * * 1'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Claude Code
        # Retried because this is a network fetch on the critical path of every
        # run, and a transient reset here fails the build for reasons that have
        # nothing to do with the change under test. Seen in practice:
        # `curl: (35) Recv failure: Connection reset by peer`.
        run: |
          for attempt in 1 2 3; do
            if curl -fsSL --retry 3 --retry-all-errors --connect-timeout 15 \
                 https://claude.ai/install.sh | bash; then
              break
            fi
            if [ "$attempt" = 3 ]; then
              echo "Claude Code install failed after 3 attempts" >&2
              exit 1
            fi
            sleep $((attempt * 5))
          done
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Report version
        run: claude --version

      - name: Validate plugin manifest
        run: claude plugin validate --strict .claude-plugin/plugin.json

      - name: Validate marketplace manifest
        run: claude plugin validate --strict .

      # plugin.json and the marketplace entry can drift apart on a release.
      # `plugin tag` refuses to tag when they disagree, so a dry run of the
      # agreement check belongs on every PR.
      - name: Check manifests agree
        run: claude plugin tag --dry-run .

      # Anthropic's plugin directory refuses hooks, scripts, and any file that
      # is not Markdown, text, JSON, YAML, or an image from an unverified
      # organization, and it judges by content as well as by name. The whole
      # repository is the plugin (marketplace source "./"), so every tracked
      # file counts, this workflow included.
      - name: Directory file rules
        run: |
          python3 - <<'PY'
          import json, subprocess, sys
          from pathlib import Path

          TEXT = {".md", ".txt", ".json", ".yaml", ".yml"}
          IMAGES = {
              ".png": [b"\x89PNG\r\n\x1a\n"],
              ".jpg": [b"\xff\xd8\xff"],
              ".jpeg": [b"\xff\xd8\xff"],
              ".gif": [b"GIF87a", b"GIF89a"],
              ".webp": [b"RIFF"],
              ".ico": [b"\x00\x00\x01\x00"],
          }
          EXTENSIONLESS = {"LICENSE", ".gitignore"}
          PACKAGE_MANAGER = {
              "package.json", "package-lock.json", "npm-shrinkwrap.json",
              "pnpm-workspace.yaml", "pnpm-lock.yaml", "yarn.lock", ".yarnrc.yml",
              ".npmrc", "bun.lockb", "bunfig.toml", "pyproject.toml",
              "requirements.txt", "Pipfile", "Pipfile.lock", "uv.lock",
              "Cargo.toml", "go.mod", "Gemfile",
          }

          problems = []
          files = subprocess.run(["git", "ls-files", "-z"], capture_output=True,
                                 check=True).stdout.decode().split("\0")
          for name in filter(None, files):
              path = Path(name)
              data = path.read_bytes()
              ext = path.suffix.lower()
              if path.name in PACKAGE_MANAGER:
                  problems.append(f"{name}: package manager configuration")
              elif ext in IMAGES:
                  if not any(data.startswith(m) for m in IMAGES[ext]):
                      problems.append(f"{name}: not the image its name says")
                  continue
              elif ext not in TEXT and path.name not in EXTENSIONLESS:
                  problems.append(f"{name}: not Markdown, text, JSON, YAML, or an image")
              if data.startswith(b"#!"):
                  problems.append(f"{name}: starts with #!")
              if b"\0" in data:
                  problems.append(f"{name}: contains a NUL byte")
              try:
                  data.decode("utf-8")
              except UnicodeDecodeError:
                  problems.append(f"{name}: not UTF-8")

          if Path("hooks").exists():
              problems.append("hooks/: the directory refuses hooks of every type")
          if "hooks" in json.loads(Path(".claude-plugin/plugin.json").read_text()):
              problems.append("plugin.json declares hooks")

          for p in problems:
              print(f"::error::{p}")
          sys.exit(1 if problems else 0)
          PY

      # Up to 0.6.0 this was ${DELPHINA_MCP_URL:-...}, which `validate --strict`
      # accepts and the directory refuses: it takes only a literal https URL.
      - name: MCP server URL is a literal https URL
        run: |
          url="$(jq -r '.mcpServers.delphina.url' .mcp.json)"
          test "$url" = "https://app.delphina.ai/api/mcp" || {
            echo "::error::.mcp.json points at [$url]"; exit 1; }

      # The sync-knowledge skill carries the snapshot install as a Bash block
      # that Claude runs. This runs that same block, taken from SKILL.md,
      # against archives served over real HTTP. A partial extraction, a cache
      # destroyed by a failed download, or a file written outside the cache
      # would all look to Claude like a knowledge base with missing documents.
      - name: Snapshot install
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          serve="$work/serve"
          mkdir -p "$serve" "$work/project"

          python3 - skills/sync-knowledge/SKILL.md "$work/install.tmpl" <<'PY'
          import re, sys
          text = open(sys.argv[1]).read()
          m = re.search(r"<!-- install-snapshot:begin -->\n```bash\n(.*?)```\n"
                        r"<!-- install-snapshot:end -->", text, re.S)
          if not m:
              sys.exit("SKILL.md has no install-snapshot block")
          block = m.group(1)
          for placeholder in ("<archive_url>", "<workspace_id>", "<snapshot_id>"):
              if f"'{placeholder}'" not in block:
                  sys.exit(f"install block lost its '{placeholder}' value")
          open(sys.argv[2], "w").write(block)
          PY

          make_zip() { # name, sync-info json, doc paths...
            local name="$1" info="$2"; shift 2
            local build="$work/build-$name"
            for path in "$@"; do
              mkdir -p "$build/$(dirname "$path")"
              echo "# content of $path" > "$build/$path"
            done
            [ -n "$info" ] && printf '%s' "$info" > "$build/sync-info.json"
            (cd "$build" && zip -qr "$serve/$name.zip" .)
          }
          make_zip good '{"layout": 1, "omitted": []}' \
            analytics/metric/revenue.md sales/table/orders.md
          make_zip shrunk '{"layout": 1, "omitted": []}' analytics/metric/revenue.md
          make_zip future '{"layout": 99, "omitted": []}' analytics/metric/revenue.md
          make_zip nolayout '{"snapshot_id": "x"}' analytics/metric/revenue.md
          # Pretty-printed, as the server writes it.
          make_zip omitting '{
            "layout": 1,
            "omitted": [
              "analytics/dbt-model/orders"
            ]
          }' analytics/metric/revenue.md
          python3 - "$serve/slip.zip" <<'PY'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1], "w") as z:
              z.writestr("sync-info.json", '{"layout": 1, "omitted": []}')
              z.writestr("analytics/metric/legit.md", "fine")
              z.writestr("../../escaped.md", "PWNED")
              z.writestr("/abs-escaped.md", "PWNED")
          PY

          python3 -u -m http.server 0 --bind 127.0.0.1 --directory "$serve" \
            > "$work/http.log" 2>&1 &
          for _ in $(seq 50); do
            port="$(sed -n 's/.*port \([0-9][0-9]*\).*/\1/p' "$work/http.log")"
            [ -n "$port" ] && break
            sleep 0.1
          done
          base="http://127.0.0.1:$port"

          install() { # url, workspace, snapshot
            python3 - "$work/install.tmpl" "$1" "$2" "$3" > "$work/install.run" <<'PY'
          import sys
          block = open(sys.argv[1]).read()
          for placeholder, value in zip(
              ("<archive_url>", "<workspace_id>", "<snapshot_id>"), sys.argv[2:]):
              block = block.replace(f"'{placeholder}'", f"'{value}'")
          print(block)
          PY
            (cd "$work/project" && bash "$work/install.run") > "$work/out" 2> "$work/err"
          }

          failures=0
          check() {
            if [ "$2" = "$3" ]; then echo "  ok: $1"
            else echo "::error::$1: expected [$2], got [$3]"; failures=$((failures + 1)); fi
          }
          root="$work/project/.delphina/knowledge"

          install "$base/good.zip" ws-1 abc && rc=0 || rc=$?
          check "installs a snapshot" 0 "$rc"
          check "stores the snapshot id" abc "$(cat "$root/ws-1/.snapshot-id")"
          check "extracts documents" "# content of sales/table/orders.md" \
            "$(cat "$root/ws-1/sales/table/orders.md")"
          check "git-ignores the cache" "*" "$(cat "$root/.gitignore")"
          check "leaves no staging dirs" "" "$(find "$root" -maxdepth 1 -name '.staging.*')"

          install "$base/gone.zip" ws-1 zzz && rc=0 || rc=$?
          check "a failed download fails" 22 "$rc"
          check "a failed download keeps the cache" abc "$(cat "$root/ws-1/.snapshot-id")"

          install "$base/future.zip" ws-1 fut && rc=0 || rc=$?
          check "refuses an unknown layout" 3 "$rc"
          check "names the layout problem" yes \
            "$(grep -q 'unsupported snapshot layout: 99' "$work/err" && echo yes || echo no)"
          check "an unknown layout keeps the cache" abc "$(cat "$root/ws-1/.snapshot-id")"

          install "$base/nolayout.zip" ws-1 nol && rc=0 || rc=$?
          check "refuses a snapshot with no layout" 3 "$rc"

          for bad in "../escape" "a/b" 'a\b' ""; do
            install "$base/good.zip" "$bad" x && rc=0 || rc=$?
            check "refuses workspace id [$bad]" 1 "$rc"
          done
          check "nothing escaped the root" "" "$(find "$work/project/.delphina" -maxdepth 1 -name 'escape*')"

          install "$base/shrunk.zip" ws-1 def && rc=0 || rc=$?
          check "a re-sync succeeds" 0 "$rc"
          check "a re-sync replaces the snapshot id" def "$(cat "$root/ws-1/.snapshot-id")"
          check "a re-sync drops deleted documents" MISSING \
            "$(cat "$root/ws-1/sales/table/orders.md" 2>/dev/null || echo MISSING)"

          install "$base/omitting.zip" ws-2 mno && rc=0 || rc=$?
          check "installs a snapshot with omissions" 0 "$rc"
          check "reports the omission" yes \
            "$(grep -q '^OMITTED: .*analytics/dbt-model/orders' "$work/out" && echo yes || echo no)"
          install "$base/good.zip" ws-3 clean && rc=0 || rc=$?
          check "reports no omission when there is none" "" "$(grep '^OMITTED' "$work/out" || true)"

          install "$base/slip.zip" ws-slip slip && rc=0 || rc=$?
          check "fails on an archive that escapes" 1 "$([ "$rc" -ne 0 ] && echo 1 || echo 0)"
          check "nothing written above the cache" "" \
            "$(find "$work" "$work/project" "$root" -maxdepth 1 -name 'escaped.md')"
          check "nothing written at the filesystem root" "" \
            "$(find / -maxdepth 1 -name 'abs-escaped.md' 2>/dev/null)"
          check "no half-built cache left" absent \
            "$([ -d "$root/ws-slip" ] && echo present || echo absent)"

          kill %1 || true
          [ "$failures" -eq 0 ]
